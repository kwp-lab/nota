name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows release assets
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Show Rust toolchain
        run: rustc --version

      - name: Use pinned npm
        shell: pwsh
        run: |
          $packageManager = node -p "require('./package.json').packageManager"
          npm install --global $packageManager

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify tag and application versions
        id: version
        shell: pwsh
        run: |
          $version = .\scripts\verify-version.ps1 -Tag $env:GITHUB_REF_NAME
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Test frontend
        run: npm test

      - name: Test Rust
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Generate third-party license report
        run: node .\scripts\generate-license-report.mjs

      - name: Build NSIS installer and executable
        run: npm run build

      - name: Package release assets
        shell: pwsh
        run: .\scripts\package-windows-release.ps1 -OutputDirectory "$env:RUNNER_TEMP\release-assets"

      - name: Upload verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nota-${{ steps.version.outputs.version }}-windows-x64
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Create draft GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nota-*-windows-x64
          path: release-assets
          merge-multiple: true

      - name: Create or update the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            is_draft="$(gh release view "$TAG" --json isDraft --jq .isDraft)"
            if [[ "$is_draft" != "true" ]]; then
              echo "Release $TAG is already published; refusing to replace its assets."
              exit 1
            fi
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --draft \
              --generate-notes \
              --title "Nota $TAG" \
              --verify-tag
          fi
