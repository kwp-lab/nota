name: Native checks

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src-tauri/**"
      - "rust-toolchain.toml"
      - "scripts/verify-version.ps1"
      - ".github/workflows/native.yml"
  push:
    branches:
      - main
    paths:
      - "src-tauri/**"
      - "rust-toolchain.toml"
      - "scripts/verify-version.ps1"
      - ".github/workflows/native.yml"

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Test and lint Rust backend
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CMAKE_POLICY_VERSION_MINIMUM: "3.5"

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install required Rust components
        run: rustup component add rustfmt clippy

      - name: Verify synchronized versions
        shell: pwsh
        run: .\scripts\verify-version.ps1

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Test Rust
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Lint Rust
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
