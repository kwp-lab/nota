name: Dependency compliance

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".npmrc"
      - "package.json"
      - "package-lock.json"
      - "src-tauri/Cargo.toml"
      - "src-tauri/Cargo.lock"
      - "src-tauri/about.toml"
      - "scripts/generate-license-report.mjs"
      - "scripts/licenses/**"
      - "THIRD_PARTY_LICENSES.md"
      - "THIRD_PARTY_NOTICES.txt"
      - "THIRD_PARTY_SOURCES.md"
      - "bom.cyclonedx.json"
      - ".github/workflows/compliance.yml"

permissions:
  contents: read

concurrency:
  group: compliance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  licenses:
    name: Verify locked dependency licenses
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use pinned npm
        shell: pwsh
        run: |
          $packageManager = node -p "require('./package.json').packageManager"
          npm install --global $packageManager

      - name: Install frontend dependencies
        run: npm ci

      - name: Restore pinned cargo-about
        id: cargo-about-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.0.3
        with:
          path: ~/.cargo/bin/cargo-about.exe
          key: cargo-about-0.9.1-windows-x64

      - name: Install pinned cargo-about
        if: steps.cargo-about-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-about --locked --version 0.9.1 --features cli

      - name: Verify license policy and generated artifacts
        run: npm run licenses:check
